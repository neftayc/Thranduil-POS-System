[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yachay-connector"
version = "2.0.0"
description = "MCP connector for explicit system selection, prepared context loading, and instruction relay."
requires-python = ">=3.11"
dependencies = ["mcp>=2,<3", "httpx>=0.27,<1", "starlette>=0.45,<2", "uvicorn>=0.30,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.23,<2"]

[project.scripts]
yachay-connector = "yachay_connector.server:main"

[tool.setuptools.packages.find]
include = ["yachay_connector*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
